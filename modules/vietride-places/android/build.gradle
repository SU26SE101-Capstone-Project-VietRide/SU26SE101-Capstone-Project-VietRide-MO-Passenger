plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vietride'
version = '1.0.0'

android {
  namespace "com.vietride.places"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Places SDK with Autocomplete (New). Keep aligned with Maps-enabled app builds.
  implementation "com.google.android.libraries.places:places:5.1.1"
}
